name: Publish Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup env
        run: |
          echo "CUR_TAG=${{ github.ref_name }}" >> $GITHUB_ENV
          echo "BASE_TAG=$(cat ./VERSION)" >> $GITHUB_ENV
          release=$(curl -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github.v3+json" https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ github.ref_name }}) || true
          BRANCH=$(echo "$release" | jq -r '.target_commitish')
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV
          JSON_BODY=$(echo "$release" | jq -r '.body')
          BUILD_NO=$(echo "$JSON_BODY" | jq -r '.buildNo // empty' 2>/dev/null || echo "")
          PRE_TAG=$(echo "$JSON_BODY" | jq -r '.preTag // empty' 2>/dev/null || echo "")
          PRERELEASE=$(echo "$release" | jq -r '.prerelease')
          echo "BUILD_NO=$BUILD_NO" >> $GITHUB_ENV
          echo "PRE_TAG=$PRE_TAG" >> $GITHUB_ENV
          echo "PRERELEASE=$PRERELEASE" >> $GITHUB_ENV
          
          echo "Debug Info: Branch=$BRANCH, Tag=${{ github.ref_name }}"
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5.0.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Prepare Assets
        run: |
          # 1. Define Source filenames (The 'latest' files uploaded by build-package.yml)
          src_offline_package="harbor-offline-installer-latest.tgz"
          src_online_package="harbor-online-installer-latest.tgz"
          src_offline_bundle="harbor-offline-installer-latest.tgz.bundle"
          src_online_bundle="harbor-online-installer-latest.tgz.bundle"

          # 2. Define Destination filenames (Renamed with the tag for the release)
          dst_offline_package="harbor-offline-installer-${{ env.CUR_TAG }}.tgz"
          dst_online_package="harbor-online-installer-${{ env.CUR_TAG }}.tgz"
          dst_offline_bundle="harbor-offline-installer-${{ env.CUR_TAG }}.tgz.bundle"
          dst_online_bundle="harbor-online-installer-${{ env.CUR_TAG }}.tgz.bundle"

          # 3. Determine S3 folder path
          # Defaults to 'test-release-feature' if env.BRANCH is missing
          SEARCH_BRANCH="${{ env.BRANCH }}"
          if [ -z "$SEARCH_BRANCH" ] || [ "$SEARCH_BRANCH" == "null" ]; then
             SEARCH_BRANCH="test-release-feature"
          fi
          
          echo "Downloading assets from Bucket: ${{ secrets.HARBOR_RELEASE_BUILD }} Folder: $SEARCH_BRANCH"

          # 4. Download and Rename from S3
          aws s3 cp "s3://${{ secrets.HARBOR_RELEASE_BUILD }}/${SEARCH_BRANCH}/${src_offline_package}" "./${dst_offline_package}"
          aws s3 cp "s3://${{ secrets.HARBOR_RELEASE_BUILD }}/${SEARCH_BRANCH}/${src_online_package}" "./${dst_online_package}"
          aws s3 cp "s3://${{ secrets.HARBOR_RELEASE_BUILD }}/${SEARCH_BRANCH}/${src_offline_bundle}" "./${dst_offline_bundle}"
          aws s3 cp "s3://${{ secrets.HARBOR_RELEASE_BUILD }}/${SEARCH_BRANCH}/${src_online_bundle}" "./${dst_online_bundle}"

          # 5. Generate MD5 Checksum
          md5sum $dst_offline_package $dst_online_package > md5sum

          # 6. Set Environment Variables for the Upload Step
          assets_path=$(pwd)
          echo "OFFLINE_PACKAGE_PATH=$assets_path/$dst_offline_package" >> $GITHUB_ENV
          echo "ONLINE_PACKAGE_PATH=$assets_path/$dst_online_package" >> $GITHUB_ENV
          echo "OFFLINE_BUNDLE_PATH=$assets_path/$dst_offline_bundle" >> $GITHUB_ENV
          echo "ONLINE_BUNDLE_PATH=$assets_path/$dst_online_bundle" >> $GITHUB_ENV
          echo "MD5SUM_PATH=$assets_path/md5sum" >> $GITHUB_ENV
      - name: Setup Docker
        uses: docker-practice/actions-setup-docker@master
        with:
          docker_version: 20.10
          docker_channel: stable
      - name: Publish Images
        run: |
          tar -zxf ${{ env.OFFLINE_PACKAGE_PATH }}
          docker load -i ./harbor/harbor.${{ env.BASE_TAG }}.tar.gz
          images="$(docker images --format "{{.Repository}}" --filter=reference='goharbor/*:${{ env.BASE_TAG }}' | xargs)"
          source tools/release/release_utils.sh
          publishImages ${{ env.CUR_TAG }} ${{ env.BASE_TAG }} "${{ secrets.DOCKER_HUB_USERNAME }}" "${{ secrets.DOCKER_HUB_PASSWORD }}" $images
          publishPackages ${{ env.CUR_TAG }} ${{ env.BASE_TAG }} ${{ github.actor }} ${{ secrets.GITHUB_TOKEN }} $images
      - name: Generate release notes
        run: |
          release_notes_path=$(pwd)/release-notes.txt
          source tools/release/release_utils.sh && generateReleaseNotes "${{ env.CUR_TAG }}" "${{ env.PRE_TAG }}" "${{ secrets.GITHUB_TOKEN }}" "${{ github.repository }}" "$release_notes_path"
          echo "RELEASE_NOTES_PATH=$release_notes_path" >> $GITHUB_ENV
      - name: RC Release
        uses: softprops/action-gh-release@v2
        if: ${{ env.PRERELEASE == 'true' }}
        with:
          body_path: ${{ env.RELEASE_NOTES_PATH }}
          files: |
            ${{ env.OFFLINE_PACKAGE_PATH }}
            ${{ env.OFFLINE_BUNDLE_PATH }}
            ${{ env.MD5SUM_PATH }}
      - name: GA Release
        uses: softprops/action-gh-release@v2
        if: ${{ env.PRERELEASE == 'false' }}
        with:
          body_path: ${{ env.RELEASE_NOTES_PATH }}
          files: |
            ${{ env.OFFLINE_PACKAGE_PATH }}
            ${{ env.OFFLINE_BUNDLE_PATH }}
            ${{ env.ONLINE_PACKAGE_PATH }}
            ${{ env.ONLINE_BUNDLE_PATH }}
            ${{ env.MD5SUM_PATH }}
